name: CI — Compilation et tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer gcc et make
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compiler le projet
        run: make

      - name: Vérifier que l'exécutable existe
        run: test -x ./symboles

      - name: Exécuter le programme
        run: ./symboles 3

      - name: Compiler les tests
        run: make tests/tests

      - name: Lancer les tests unitaires
        run: make check
