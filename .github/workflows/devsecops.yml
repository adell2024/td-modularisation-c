name: DevSecOps — Build, Tests, Qualité et Sécurité

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # BLOQUANT : si le code ne compile pas ou si les tests échouent,
  # le pipeline principal est en échec.
  build-test:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les outils C
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compiler
        run: make

      - name: Vérifier l'exécutable
        run: test -x ./symboles

      - name: Tester l'application
        run: ./symboles 3

      - name: Compiler les tests
        run: make tests/tests

      - name: Tests unitaires
        run: make check

  # NON BLOQUANTS : ces analyses peuvent échouer sans faire échouer
  # le workflow global. Elles restent néanmoins visibles en rouge dans Actions.
  static-analysis:
    name: Analyse statique — Cppcheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Analyser le code C
        run: >-
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --language=c
          --std=c99
          --suppress=missingIncludeSystem
          .

  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Semgrep
        run: python3 -m pip install --user semgrep

      - name: Analyse SAST
        run: ~/.local/bin/semgrep scan --config p/c --error

  secrets:
    name: Recherche de secrets — Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer tout l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA — Trivy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # trivy-action installe Trivy lui-même : pas besoin de setup-trivy.
      # On utilise une version d'action existante et on laisse l'analyse non bloquante.
      - name: Scanner le dépôt avec Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  sbom:
    name: SBOM — Syft
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Générer le SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
          upload-artifact: true

  # Ce job ne bloque pas le build : il sert uniquement de synthèse.
  devsecops-summary:
    name: Build OK — synthèse
    runs-on: ubuntu-latest
    needs: [build-test, static-analysis, sast, secrets, sca, sbom]
    if: ${{ always() && needs.build-test.result == 'success' }}
    steps:
      - name: Pipeline principal réussi
        run: |
          echo 'Compilation et tests : OK'
          echo 'Les analyses qualité et sécurité sont non bloquantes.'
