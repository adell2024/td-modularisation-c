name: DevSecOps — Build, Tests, Qualité et Sécurité

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les outils C
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compiler
        run: make

      - name: Vérifier l'exécutable
        run: test -x ./symboles

      - name: Tester l'application
        run: ./symboles 3

      - name: Compiler les tests
        run: make tests/tests

      - name: Tests unitaires
        run: make check

  static-analysis:
    name: Analyse statique — Cppcheck
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Analyser le code C
        run: >-
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --language=c
          --std=c99
          --suppress=missingIncludeSystem
          .

  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Semgrep
        run: python3 -m pip install --user semgrep

      - name: Analyse SAST
        run: ~/.local/bin/semgrep scan --config p/c --error

  secrets:
    name: Recherche de secrets — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tout l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA — dépendances et fichiers
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Scanner le dépôt
        run: trivy fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL .

  sbom:
    name: SBOM — Syft
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Générer le SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
          upload-artifact: true

  devsecops-summary:
    name: Build OK — synthèse
    runs-on: ubuntu-latest
    needs: [build-test, static-analysis, sast, secrets, sca, sbom]
    steps:
      - name: Pipeline DevSecOps réussi
        run: echo "Compilation, tests, qualité, SAST, secrets, SCA et SBOM : OK"
